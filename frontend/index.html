<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OdomAI — Beyond the odometer. Know your car's true value.</title>
  <meta name="description" content="OdomAI uses AI to predict the true market value of any used car. Enter your vehicle's details and get an instant price estimate." />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { margin: 0; background: #EEEDFE; }
    body { min-height: 100vh; }
  </style>

  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useCallback } = React;

    const COLORS = {
      purple: '#534AB7',
      dial: '#AFA9EC',
      gaugeLight: '#EEEDFE',
      night: '#0F0B26',
      green: '#1D9E75',
      red: '#C24B4B',
      white: '#FFFFFF',
    };

    const TAGLINE = "Beyond the odometer. Know your car's true value.";
    const API_BASE = ['localhost', '127.0.0.1'].includes(window.location.hostname)
      ? ''
      : 'https://odomai.onrender.com';
    const CURRENT_YEAR = new Date().getFullYear();
    const MIN_YEAR = 1995;
    const MAX_YEAR = 2024;
    const MIN_MILES = 1000;
    const MAX_MILES = 300000;

    function normalizeMetadata(raw) {
      if (!raw || typeof raw !== 'object') return { manufacturers: [], modelsByManufacturer: {}, fuelTypes: [], transmissions: [] };

      const manufacturers = raw.manufacturers || raw.makes || raw.manufacturer_list || Object.keys(raw.models_by_make || raw.modelsByManufacturer || {});
      const modelsByManufacturer = raw.models_by_manufacturer || raw.modelsByManufacturer || raw.models_by_make || raw.models || {};
      const fuelTypes = raw.fuel_types || raw.fuelTypes || ['gas', 'diesel', 'hybrid', 'electric'];
      const transmissions = raw.transmissions || ['automatic', 'manual'];

      return {
        manufacturers: Array.isArray(manufacturers) ? manufacturers : [],
        modelsByManufacturer: modelsByManufacturer && typeof modelsByManufacturer === 'object' ? modelsByManufacturer : {},
        fuelTypes: Array.isArray(fuelTypes) ? fuelTypes : [],
        transmissions: Array.isArray(transmissions) ? transmissions : [],
      };
    }

    function placeholderConfidence({ year, miles }) {
      const age = Math.max(0, CURRENT_YEAR - Number(year || CURRENT_YEAR));
      const mileage = Math.max(0, Number(miles || 0));
      const ageCenter = 9;
      const mileageCenter = 70000;
      const ageSpread = 12;
      const mileageSpread = 90000;
      const ageDistance = Math.abs(age - ageCenter) / ageSpread;
      const mileageDistance = Math.abs(mileage - mileageCenter) / mileageSpread;
      const score = 100 - (ageDistance * 70) - (mileageDistance * 50);
      return Math.max(38, Math.min(96, Math.round(score)));
    }

    function formatCurrency(n) {
      return new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD', maximumFractionDigits: 0 }).format(n);
    }

    function formatMiles(n) {
      return new Intl.NumberFormat('en-US').format(n);
    }

    function confidenceColor(pct) {
      const t = Math.max(0, Math.min(100, pct)) / 100;
      const hex = (c) => Math.round(c).toString(16).padStart(2, '0');
      const from = { r: 0xc2, g: 0x4b, b: 0x4b };
      const to = { r: 0x1d, g: 0x9e, b: 0x75 };
      const r = from.r + (to.r - from.r) * t;
      const g = from.g + (to.g - from.g) * t;
      const b = from.b + (to.b - from.b) * t;
      return `#${hex(r)}${hex(g)}${hex(b)}`;
    }

    function computeConfidence(payload) {
      const year = Number(payload.year ?? CURRENT_YEAR);
      const odometer = Number(payload.odometer ?? 0);
      const age = Math.max(0, CURRENT_YEAR - year);
      const ageCenter = 9;
      const mileageCenter = 70000;
      const ageSpread = 12;
      const mileageSpread = 90000;
      const ageDistance = Math.abs(age - ageCenter) / ageSpread;
      const mileageDistance = Math.abs(odometer - mileageCenter) / mileageSpread;
      const score = 100 - (ageDistance * 70) - (mileageDistance * 50);
      return Math.max(38, Math.min(96, Math.round(score)));
    }

    function Logo({ variant = 'light', size = 28 }) {
      const ink = variant === 'dark' ? COLORS.white : variant === 'brand' ? COLORS.purple : COLORS.night;
      const needle = variant === 'dark' ? COLORS.dial : COLORS.purple;
      return (
        <div style={{ display: 'flex', alignItems: 'center', gap: 10 }}>
          <svg width={size} height={size} viewBox="0 0 40 40" aria-hidden="true">
            <circle cx="20" cy="20" r="18" fill="none" stroke={variant === 'dark' ? COLORS.dial : COLORS.gaugeLight} strokeWidth="3" />
            <path d="M20 20 L28 12" stroke={needle} strokeWidth="2.5" strokeLinecap="round" />
            <circle cx="20" cy="20" r="3" fill={needle} />
          </svg>
          <span style={{ fontFamily: "'Fraunces', Georgia, serif", fontWeight: 600, fontSize: size * 0.75, color: ink, letterSpacing: '-0.01em' }}>
            Odom<span style={{ color: variant === 'brand' ? ink : COLORS.purple }}>AI</span>
          </span>
        </div>
      );
    }

    function ConfidenceDial({ pct }) {
      const clamped = Math.max(0, Math.min(100, pct));
      const angle = -90 + (clamped / 100) * 180;
      const color = confidenceColor(clamped);
      const r = 80;
      const cx = 100;
      const cy = 100;
      const describeArc = (startAngle, endAngle) => {
        const toRad = (deg) => ((deg - 180) * Math.PI) / 180;
        const start = { x: cx + r * Math.cos(toRad(startAngle)), y: cy + r * Math.sin(toRad(startAngle)) };
        const end = { x: cx + r * Math.cos(toRad(endAngle)), y: cy + r * Math.sin(toRad(endAngle)) };
        const largeArc = endAngle - startAngle > 180 ? 1 : 0;
        return `M ${start.x} ${start.y} A ${r} ${r} 0 ${largeArc} 1 ${end.x} ${end.y}`;
      };
      const needleLen = r - 10;
      const tipX = cx + needleLen * Math.sin((angle * Math.PI) / 180);
      const tipY = cy - needleLen * Math.cos((angle * Math.PI) / 180);
      const perpAngle = angle + 90;
      const baseWidth = 5;
      const baseLx = cx + baseWidth * Math.sin((perpAngle * Math.PI) / 180);
      const baseLy = cy - baseWidth * Math.cos((perpAngle * Math.PI) / 180);
      const baseRx = cx - baseWidth * Math.sin((perpAngle * Math.PI) / 180);
      const baseRy = cy + baseWidth * Math.cos((perpAngle * Math.PI) / 180);
      const markerX = cx + r * Math.sin((angle * Math.PI) / 180);
      const markerY = cy - r * Math.cos((angle * Math.PI) / 180);

      return (
        <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 6 }}>
          <svg width="220" height="130" viewBox="0 0 200 115" role="img" aria-label={`${clamped}% confidence`}>
            <defs>
              <linearGradient id="odomai-gauge-grad" x1="0%" y1="0%" x2="100%" y2="0%">
                <stop offset="0%" stopColor={COLORS.red} />
                <stop offset="50%" stopColor="#D9A441" />
                <stop offset="100%" stopColor={COLORS.green} />
              </linearGradient>
            </defs>
            <path d={describeArc(0, 180)} fill="none" stroke={COLORS.gaugeLight} strokeWidth="14" strokeLinecap="round" />
            <path d={describeArc(0, 180)} fill="none" stroke="url(#odomai-gauge-grad)" strokeWidth="14" strokeLinecap="round" opacity="0.9" />
            <circle cx={markerX} cy={markerY} r="7" fill={COLORS.white} stroke={color} strokeWidth="3" />
            <line x1={cx} y1={cy} x2={tipX} y2={tipY} stroke={COLORS.night} strokeWidth="3" strokeLinecap="round" />
            <polygon points={`${tipX},${tipY} ${baseLx},${baseLy} ${baseRx},${baseRy}`} fill={COLORS.night} />
            <circle cx={cx} cy={cy} r="6" fill={COLORS.night} />
          </svg>
          <div style={{ fontFamily: "'Fraunces', Georgia, serif", fontSize: 28, fontWeight: 600, color }}>
            {clamped}%
          </div>
          <div style={{ fontSize: 12, letterSpacing: '0.02em', color: COLORS.white, opacity: 0.9, fontWeight: 500 }}>
            AI confidence reading
          </div>
        </div>
      );
    }

    function OdomAI() {
      const [isMobile, setIsMobile] = useState(() => typeof window !== 'undefined' ? window.innerWidth <= 680 : false);
      const [metadata, setMetadata] = useState({ manufacturers: [], modelsByManufacturer: {}, fuelTypes: [], transmissions: [] });
      const [metadataError, setMetadataError] = useState(null);
      const [loadingMetadata, setLoadingMetadata] = useState(true);
      const [manufacturer, setManufacturer] = useState('');
      const [model, setModel] = useState('');
      const [fuel, setFuel] = useState('');
      const [transmission, setTransmission] = useState('');
      const [year, setYear] = useState('');
      const [miles, setMiles] = useState('');
      const [submitting, setSubmitting] = useState(false);
      const [result, setResult] = useState(null);
      const [apiError, setApiError] = useState(null);
      const [currentView, setCurrentView] = useState('predict');
      const [readingHistory, setReadingHistory] = useState([]);
      const [loadingHistory, setLoadingHistory] = useState(false);

      useEffect(() => {
        const handleResize = () => setIsMobile(window.innerWidth <= 680);
        handleResize();
        window.addEventListener('resize', handleResize);
        return () => window.removeEventListener('resize', handleResize);
      }, []);

      const fetchHistory = useCallback(async () => {
        setLoadingHistory(true);
        try {
          const res = await fetch(`${API_BASE}/cars`, { credentials: 'include' });
          if (res.ok) {
            const data = await res.json();
            const normalized = data.map((r) => ({
              manufacturer: r.make,
              model: r.model,
              year: r.year,
              odometer: r.mileage,
              price: r.predicted_price,
              confidence: typeof r.confidence === 'number' ? r.confidence : placeholderConfidence({ year: r.year, miles: r.mileage }),
              created_at: r.created_at,
            }));
            setReadingHistory(normalized);
          }
        } catch (err) {
          console.error('Failed to fetch history', err);
        } finally {
          setLoadingHistory(false);
        }
      }, []);

      useEffect(() => {
        if (currentView === 'history') {
          fetchHistory();
        }
      }, [currentView, fetchHistory]);

      useEffect(() => {
        let cancelled = false;
        (async () => {
          try {
            setLoadingMetadata(true);
            const res = await fetch(`${API_BASE}/metadata`);
            if (!res.ok) throw new Error(`Metadata request failed (${res.status})`);
            const raw = await res.json();
            if (!cancelled) setMetadata(normalizeMetadata(raw));
          } catch (err) {
            if (!cancelled) setMetadataError(err.message || "Couldn't load make/model list.");
          } finally {
            if (!cancelled) setLoadingMetadata(false);
          }
        })();
        return () => { cancelled = true; };
      }, []);

      const models = useMemo(() => {
        if (!manufacturer) return [];
        return metadata.modelsByManufacturer[manufacturer] || [];
      }, [manufacturer, metadata]);

      const yearError = year !== '' && (!/^\d+$/.test(String(year)) || Number(year) < MIN_YEAR || Number(year) > MAX_YEAR)
        ? `Enter a year between ${MIN_YEAR} and ${MAX_YEAR}.`
        : null;

      const milesError = miles !== '' && (!/^\d+$/.test(String(miles)) || Number(miles) < MIN_MILES || Number(miles) > MAX_MILES)
        ? `Enter mileage between ${formatMiles(MIN_MILES)} and ${formatMiles(MAX_MILES)}.`
        : null;

      const canSubmit = manufacturer && model && fuel && transmission && year !== '' && miles !== '' && !yearError && !milesError && !submitting;

      const handleManufacturerChange = (e) => {
        setManufacturer(e.target.value);
        setModel('');
        setResult(null);
      };

      const handleYearChange = (e) => setYear(e.target.value.replace(/[^\d]/g, '').slice(0, 4));
      const handleMilesChange = (e) => setMiles(e.target.value.replace(/[^\d]/g, '').slice(0, 6));

      const calculate = useCallback(async () => {
        if (!canSubmit) return;
        setSubmitting(true);
        setApiError(null);
        setResult(null);

        const payload = {
          manufacturer,
          model,
          fuel,
          transmission,
          year: Number(year),
          odometer: Number(miles),
        };

        try {
          const res = await fetch(`${API_BASE}/predict`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            credentials: 'include',
            body: JSON.stringify(payload),
          });

          if (!res.ok) {
            let errMsg = `Prediction request failed (${res.status})`;
            try {
              const e = await res.json();
              if (e.error) errMsg = e.error;
            } catch {}
            throw new Error(errMsg);
          }

          const data = await res.json();
          const price = data.predicted_price ?? data.price;
          const confidence = typeof data.confidence === 'number' ? data.confidence : computeConfidence(payload);

          if (typeof price !== 'number') throw new Error('No price came back from the model.');

          setResult({ ...payload, price, confidence, timestamp: new Date().toISOString() });
        } catch (err) {
          setApiError(err.message || 'Something went wrong getting a reading.');
        } finally {
          setSubmitting(false);
        }
      }, [canSubmit, manufacturer, model, fuel, transmission, year, miles]);

      return (
        <div style={{ ...styles.page, ...(isMobile ? { paddingBottom: 20 } : {}) }}>
          <style>{FONT_IMPORT}</style>

          <header style={{ ...styles.header, ...(isMobile ? { paddingTop: 20 } : {}) }}>
            <div style={{ ...styles.headerTop, ...(isMobile ? { flexDirection: 'column', alignItems: 'stretch', gap: 12 } : {}) }}>
              <Logo variant="light" size={isMobile ? 24 : 30} />
              <nav style={{ ...styles.nav, ...(isMobile ? { width: '100%', justifyContent: 'space-between' } : {}) }}>
                <button style={currentView === 'predict' ? styles.navActive : styles.navButton} onClick={() => setCurrentView('predict')}>Predict</button>
                <button style={currentView === 'history' ? styles.navActive : styles.navButton} onClick={() => setCurrentView('history')}>My Cars</button>
              </nav>
            </div>
            <p style={{ ...styles.tagline, ...(isMobile ? { fontSize: 18 } : {}) }}>{TAGLINE}</p>
          </header>

          <main style={{ ...styles.main, ...(isMobile ? { padding: '0 16px 20px' } : {}) }}>
            {currentView === 'predict' ? (
              <>
                <section style={{ ...styles.card, ...(isMobile ? { padding: 16 } : {}) }}>
                  <h2 style={{ ...styles.cardTitle, ...(isMobile ? { fontSize: 18 } : {}) }}>Take a reading</h2>

                  <div style={{ ...styles.formGrid, ...(isMobile ? { gridTemplateColumns: '1fr' } : {}) }}>
                    <label style={styles.field}>
                      <span style={styles.label}>Manufacturer</span>
                      <select style={styles.select} value={manufacturer} onChange={handleManufacturerChange} disabled={loadingMetadata}>
                        <option value="">{loadingMetadata ? 'Loading…' : 'Select manufacturer'}</option>
                        {metadata.manufacturers.map((m) => <option key={m} value={m}>{m}</option>)}
                      </select>
                    </label>

                    <label style={styles.field}>
                      <span style={styles.label}>Model</span>
                      <select style={styles.select} value={model} onChange={(e) => setModel(e.target.value)} disabled={!manufacturer}>
                        <option value="">{manufacturer ? 'Select model' : 'Pick a manufacturer first'}</option>
                        {models.map((m) => <option key={m} value={m}>{m}</option>)}
                      </select>
                    </label>

                    <label style={styles.field}>
                      <span style={styles.label}>Fuel Type</span>
                      <select style={styles.select} value={fuel} onChange={(e) => setFuel(e.target.value)} disabled={metadata.fuelTypes.length === 0}>
                        <option value="">Select fuel type</option>
                        {metadata.fuelTypes.map((f) => <option key={f} value={f}>{f.charAt(0).toUpperCase() + f.slice(1)}</option>)}
                      </select>
                    </label>

                    <label style={styles.field}>
                      <span style={styles.label}>Transmission</span>
                      <select style={styles.select} value={transmission} onChange={(e) => setTransmission(e.target.value)} disabled={metadata.transmissions.length === 0}>
                        <option value="">Select transmission</option>
                        {metadata.transmissions.map((t) => <option key={t} value={t}>{t.charAt(0).toUpperCase() + t.slice(1)}</option>)}
                      </select>
                    </label>

                    <label style={styles.field}>
                      <span style={styles.label}>Year</span>
                      <input style={{ ...styles.input, ...(yearError ? styles.inputError : {}) }} type="number" inputMode="numeric" value={year} placeholder={`e.g. ${CURRENT_YEAR - 3}`} onChange={handleYearChange} />
                      {yearError && <span style={styles.errorText}>{yearError}</span>}
                    </label>

                    <label style={styles.field}>
                      <span style={styles.label}>Miles</span>
                      <input style={{ ...styles.input, ...(milesError ? styles.inputError : {}) }} type="number" inputMode="numeric" value={miles} placeholder="e.g. 42000" onChange={handleMilesChange} />
                      {milesError && <span style={styles.errorText}>{milesError}</span>}
                    </label>
                  </div>

                  {metadataError && <p style={styles.warnText}>{metadataError} — you can still type once the list loads.</p>}
                  <button style={{ ...styles.button, opacity: canSubmit ? 1 : 0.5 }} onClick={calculate} disabled={!canSubmit}>
                    {submitting ? 'Reading the gauges…' : 'Calculate price'}
                  </button>
                  {apiError && <p style={styles.errorText}>{apiError}</p>}
                </section>

                {result && (
                  <section style={{ ...styles.resultCard, ...(isMobile ? { padding: 18, justifyContent: 'center' } : {}) }}>
                    <div style={styles.priceBlock}>
                      <span style={styles.priceLabel}>Estimated value</span>
                      <span style={{ ...styles.price, ...(isMobile ? { fontSize: 34 } : {}) }}>{formatCurrency(result.price)}</span>
                      <span style={styles.priceSub}>{result.year} {result.manufacturer} {result.model} · {formatMiles(result.odometer)} mi · {result.fuel} · {result.transmission}</span>
                    </div>
                    <ConfidenceDial pct={result.confidence} />
                  </section>
                )}
              </>
            ) : (
              <section style={{ ...styles.historyCard, ...(isMobile ? { padding: 16 } : {}) }}>
                <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 16, gap: 12 }}>
                  <h2 style={{ ...styles.cardTitle, margin: 0 }}>My Cars</h2>
                  <button style={styles.refreshButton} onClick={fetchHistory} disabled={loadingHistory}>{loadingHistory ? 'Refreshing...' : 'Refresh'}</button>
                </div>
                {readingHistory.length === 0 ? (
                  <p style={styles.mutedText}>{loadingHistory ? 'Loading your history...' : 'No saved cars yet. Take a reading to start tracking!'}</p>
                ) : (
                  <div style={styles.historyTableWrap}>
                    <table style={styles.historyTable}>
                      <thead>
                        <tr>
                          <th style={styles.th}>Vehicle</th>
                          <th style={styles.th}>Year</th>
                          <th style={styles.th}>Miles</th>
                          <th style={styles.th}>Price</th>
                          <th style={styles.th}>Confidence</th>
                        </tr>
                      </thead>
                      <tbody>
                        {readingHistory.map((r, i) => (
                          <tr key={i}>
                            <td style={styles.td}>{r.manufacturer} {r.model}</td>
                            <td style={styles.td}>{r.year}</td>
                            <td style={styles.td}>{formatMiles(r.odometer)}</td>
                            <td style={styles.td}>{formatCurrency(r.price)}</td>
                            <td style={{ ...styles.td, color: confidenceColor(r.confidence), fontWeight: 600 }}>{r.confidence}%</td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                )}
              </section>
            )}
          </main>

          <footer style={{ ...styles.footer, ...(isMobile ? { padding: '16px 16px 24px' } : {}) }}>
            <Logo variant="light" size={18} />
            <span style={styles.footerText}>Gauges, not guesswork.</span>
          </footer>
        </div>
      );
    }

    const FONT_IMPORT = "@import url('https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Inter:wght@400;500;600&display=swap');";

    const styles = {
      page: {
        minHeight: '100vh',
        background: COLORS.gaugeLight,
        color: COLORS.night,
        fontFamily: "'Inter', system-ui, sans-serif",
        display: 'flex',
        flexDirection: 'column',
      },
      header: {
        padding: '28px 24px 20px',
        display: 'flex',
        flexDirection: 'column',
        gap: 8,
        maxWidth: 760,
        margin: '0 auto',
        width: '100%',
        boxSizing: 'border-box',
      },
      headerTop: {
        display: 'flex',
        justifyContent: 'space-between',
        alignItems: 'center',
        width: '100%',
      },
      nav: {
        display: 'flex',
        gap: 8,
        background: COLORS.white,
        padding: 4,
        borderRadius: 20,
        border: `1px solid ${COLORS.dial}33`,
      },
      navButton: {
        padding: '6px 14px',
        borderRadius: 16,
        border: 'none',
        background: 'transparent',
        color: COLORS.night,
        opacity: 0.7,
        fontSize: 14,
        fontWeight: 500,
        cursor: 'pointer',
      },
      navActive: {
        padding: '6px 14px',
        borderRadius: 16,
        border: 'none',
        background: COLORS.gaugeLight,
        color: COLORS.night,
        fontSize: 14,
        fontWeight: 600,
        cursor: 'default',
      },
      tagline: {
        margin: 0,
        fontFamily: "'Fraunces', Georgia, serif",
        fontSize: 20,
        color: COLORS.night,
        opacity: 0.85,
      },
      main: {
        flex: 1,
        maxWidth: 760,
        margin: '0 auto',
        width: '100%',
        padding: '0 24px 48px',
        display: 'flex',
        flexDirection: 'column',
        gap: 20,
        boxSizing: 'border-box',
      },
      card: {
        background: COLORS.white,
        borderRadius: 16,
        padding: 24,
        boxShadow: '0 1px 2px rgba(15,11,38,0.06)',
        border: `1px solid ${COLORS.dial}33`,
      },
      cardTitle: {
        margin: '0 0 16px',
        fontFamily: "'Fraunces', Georgia, serif",
        fontSize: 20,
        fontWeight: 600,
      },
      formGrid: {
        display: 'grid',
        gridTemplateColumns: '1fr 1fr',
        gap: 16,
      },
      field: { display: 'flex', flexDirection: 'column', gap: 6 },
      label: { fontSize: 13, color: COLORS.night, opacity: 0.7 },
      select: { padding: '10px 12px', borderRadius: 10, border: `1px solid ${COLORS.dial}66`, background: COLORS.gaugeLight, fontSize: 15, color: COLORS.night },
      input: { padding: '10px 12px', borderRadius: 10, border: `1px solid ${COLORS.dial}66`, background: COLORS.gaugeLight, fontSize: 15, color: COLORS.night },
      inputError: { border: `1px solid ${COLORS.red}` },
      errorText: { color: COLORS.red, fontSize: 12 },
      warnText: { color: COLORS.red, fontSize: 13, marginTop: 12 },
      mutedText: { color: COLORS.night, opacity: 0.6, fontSize: 14 },
      button: { marginTop: 20, width: '100%', padding: '14px 20px', borderRadius: 12, border: 'none', background: COLORS.purple, color: COLORS.white, fontSize: 16, fontWeight: 600, cursor: 'pointer' },
      resultCard: {
        background: COLORS.night,
        borderRadius: 16,
        padding: 28,
        display: 'flex',
        alignItems: 'center',
        justifyContent: 'space-between',
        flexWrap: 'wrap',
        gap: 20,
      },
      priceBlock: { display: 'flex', flexDirection: 'column', gap: 4 },
      priceLabel: { color: COLORS.dial, fontSize: 13 },
