<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Car Price Predictor Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            max-width: 500px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 5px;
        }

        select,
        input {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
        }

        button {
            padding: 10px 15px;
            background-color: #007BFF;
            color: white;
            border: none;
            cursor: pointer;
        }

        button:hover {
            background-color: #0056b3;
        }

        .result {
            margin-top: 20px;
            padding: 15px;
            background-color: #e9ecef;
            font-size: 1.2em;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <h2>Used Car Price Predictor</h2>

    <form action="/predict" method="post">

        <div class="form-group">
            <label>Manufacturer:</label>
            <!-- The onchange event triggers our JavaScript to update the models -->
            <select name="manufacturer" id="manufacturer" onchange="updateModels()" required>
                <!-- Options will be populated by JavaScript -->
            </select>
        </div>

        <div class="form-group">
            <label>Model:</label>
            <select name="model" id="model" required>
                <!-- Options will be populated by JavaScript based on the manufacturer -->
            </select>
        </div>

        <div class="form-group">
            <label>Fuel Type:</label>
            <select name="fuel" required>
                <option value="gas" {% if form_data.fuel=='gas' %}selected{% endif %}>Gas</option>
                <option value="diesel" {% if form_data.fuel=='diesel' %}selected{% endif %}>Diesel</option>
                <option value="hybrid" {% if form_data.fuel=='hybrid' %}selected{% endif %}>Hybrid</option>
                <option value="electric" {% if form_data.fuel=='electric' %}selected{% endif %}>Electric</option>
            </select>
        </div>

        <div class="form-group">
            <label>Transmission:</label>
            <select name="transmission" required>
                <option value="automatic" {% if form_data.transmission=='automatic' %}selected{% endif %}>Automatic
                </option>
                <option value="manual" {% if form_data.transmission=='manual' %}selected{% endif %}>Manual</option>
                <option value="other" {% if form_data.transmission=='other' %}selected{% endif %}>Other</option>
            </select>
        </div>

        <div class="form-group">
            <label>Year:</label>
            <input type="number" name="year" min="1900" max="2030"
                value="{{ form_data.year if form_data.year else '2015' }}" required>
        </div>

        <div class="form-group">
            <label>Odometer (Miles):</label>
            <input type="number" name="odometer" min="1000" max="300000"
                value="{{ form_data.odometer if form_data.odometer else '50000' }}" required>
        </div>

        <button type="submit">Predict Price</button>
    </form>

    {% if prediction %}
    <div class="result">
        Estimated Value: {{ prediction }}
    </div>
    {% endif %}

                opt.selected = true;
            }
            mfrSelect.appendChild(opt);
        }

            const currentMfr = mfrSelect.value;

            // Clear out the old models
            modelSelect.innerHTML = "";

            if (carData[currentMfr]) {
                carData[currentMfr].forEach(model => {
                    const opt = document.createElement("option");
                    opt.value = model;

                    // Capitalize the first letter of each word for a cleaner look
                    opt.textContent = model.split(' ').map(w => w.charAt(0).toUpperCase() + w.slice(1)).join(' ');

                        opt.selected = true;
                    }
                    modelSelect.appendChild(opt);
                });
            }
